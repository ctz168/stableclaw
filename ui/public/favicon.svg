<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="scBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F766E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#115E59;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="scClaw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5EEAD4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2DD4BF;stop-opacity:1" />
    </linearGradient>
    <filter id="scShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <clipPath id="scClip">
      <rect x="16" y="16" width="480" height="480" rx="96" ry="96"/>
    </clipPath>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#scBg)" filter="url(#scShadow)"/>

  <!-- Claw grip icon - three curved blades converging -->
  <g transform="translate(256, 270)" fill="none" stroke="url(#scClaw)" stroke-width="28" stroke-linecap="round">
    <!-- Top claw -->
    <path d="M0,-80 Q-60,-50 -85,10"/>
    <!-- Right claw -->
    <path d="M0,-80 Q60,-50 85,10"/>
    <!-- Center claw -->
    <path d="M0,-80 Q0,-10 0,50"/>
  </g>

  <!-- Claw tips -->
  <g fill="#5EEAD4">
    <circle cx="-88" cy="12" r="8"/>
    <circle cx="88" cy="12" r="8"/>
    <circle cx="0" cy="52" r="8"/>
  </g>

  <!-- "SC" text branding -->
  <text x="256" y="400" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900" fill="#CCFBF1" text-anchor="middle" letter-spacing="-2">SC</text>

  <!-- Subtle inner border -->
  <rect x="36" y="36" width="440" height="440" rx="80" ry="80" fill="none" stroke="#14B8A6" stroke-width="2" opacity="0.3"/>
</svg>
